name: Deploy datetime

on:
  push:
    branches:
      - main
    paths:
      - "components/datetime/**"
      - "packages/brain-sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-component.yml"
      - ".github/workflows/deploy-datetime.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-component.yml
    with:
      component_name: datetime
      component_path: components/datetime
    secrets: inherit
