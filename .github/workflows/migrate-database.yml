name: Migrate database

on:
  push:
    branches:
      - main
    paths:
      - "components/database/migrations/**"
      - "components/database/wrangler.jsonc"
      - ".github/workflows/migrate-database.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-database-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Apply remote D1 migrations
        run: pnpm --dir components/database run migration:apply:remote
