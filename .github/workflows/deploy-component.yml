name: Deploy Component

on:
  workflow_call:
    inputs:
      component_name:
        required: true
        type: string
      component_path:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.component_name }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.component_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYED_AT: ${{ github.event.head_commit.timestamp || github.run_id }}
      GIT_BRANCH: ${{ github.ref_name }}
      GIT_COMMIT_HASH: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build brain-sdk
        run: pnpm --filter brain-sdk build

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Inject deploy identity vars
        run: |
          node -e '
          const fs = require("fs");
          const path = process.argv[1];
          let text = fs.readFileSync(path, "utf8");
          for (const [key, value] of Object.entries({
            GIT_BRANCH: process.env.GIT_BRANCH || "unknown",
            GIT_COMMIT_HASH: process.env.GIT_COMMIT_HASH || "unknown",
            DEPLOYED_AT: process.env.DEPLOYED_AT || "unknown",
          })) {
            const pattern = new RegExp(`"${key}":\\s*"[^"]*"`, "g");
            text = text.replace(pattern, `"${key}": "${value}"`);
          }
          fs.writeFileSync(path, text);
          ' "${{ inputs.component_path }}/wrangler.jsonc"

      - name: Deploy Worker
        run: pnpm --dir ${{ inputs.component_path }} run deploy
