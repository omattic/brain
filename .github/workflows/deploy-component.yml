name: Deploy Component

on:
  workflow_call:
    inputs:
      component_name:
        required: true
        type: string
      component_path:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.component_name }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.component_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build brain-sdk
        run: pnpm --filter brain-sdk build

      - name: Deploy Worker
        run: pnpm --dir ${{ inputs.component_path }} deploy
