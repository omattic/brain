name: Deploy admin

on:
  push:
    branches:
      - main
    paths:
      - "components/admin/**"
      - "components/database/**"
      - "packages/brain-sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-component.yml"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-component.yml
    with:
      component_name: admin
      component_path: components/admin
    secrets: inherit
