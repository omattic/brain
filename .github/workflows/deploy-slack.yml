name: Deploy slack

on:
  push:
    branches:
      - main
    paths:
      - "components/slack/**"
      - "packages/brain-sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-component.yml"
      - ".github/workflows/deploy-slack.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-component.yml
    with:
      component_name: slack
      component_path: components/slack
    secrets: inherit
