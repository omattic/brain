apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slack-bot-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"  # Use the appropriate ingress class for your cluster
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If using cert-manager for TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"  # Force SSL
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"  # Increase allowed body size if needed
spec:
  tls:
  - hosts:
    - slack-bot.rpotential.dev
    secretName: slack-bot-tls
  rules:
  - host: slack-bot.rpotential.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: slack-bot-service  # Point to the ClusterIP service
            port:
              number: 80
